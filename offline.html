<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lava-Jato · sem conexão</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0e0e10; color: #ececee; font-family: "Segoe UI", system-ui, sans-serif; }
  .box { width: min(420px, calc(100vw - 32px)); background: #19191c; border: 1px solid #2e2e33; border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }
  p { margin: 0; color: #9b9ba3; line-height: 1.45; }
  button { font: inherit; font-weight: 600; padding: 12px; border-radius: 8px; border: 0; background: #e4e4e7; color: #111113; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e4e4e7; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Sem conexão</h1>
    <p>O Lava-Jato precisa de internet para mostrar o pátio e salvar os carros. Confira o Wi-Fi ou o cabo de rede e tente de novo.</p>
    <button id="tentar" autofocus>Tentar de novo</button>
  </div>
  <script>
    const ir = () => { location.href = "https://lava-jato-mu-three.vercel.app"; };
    document.getElementById("tentar").addEventListener("click", ir);
    addEventListener("online", ir);
  </script>
</body>
</html>
